<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cert Study Hub</title>
  <script>window.LCERT_SETTINGS_KEY="cert-study-hub-settings";try{var s=JSON.parse(localStorage.getItem(window.LCERT_SETTINGS_KEY)||'{}'),c=document.documentElement.classList;if(s.dark===true||(s.dark===undefined&&matchMedia('(prefers-color-scheme: dark)').matches))c.add('dark');}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .brand-flag, .lang-row, .tts-rate-row, .switch-row:has([data-setting="memorize"]) { display: none !important; }
    .hub-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menu-toggle" aria-label="メニュー">☰</button>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="index.html">Cert Study Hub<span>資格学習ハブ</span></a>
      <nav class="nav-section">
        <h2>資格</h2>
        <a href="security-plus/index.html">CompTIA Security+</a>
        <a href="ccna/index.html">CCNA</a>
        <a href="linuc-1/index.html">LinuC-1</a>
      </nav>
      <section class="nav-section settings" aria-label="設定">
        <h2>設定</h2>
        <label class="switch-row">
          <span>ダークモード</span>
          <input type="checkbox" role="switch" data-setting="dark">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>
    </aside>
    <main class="main">
      <header class="hero">
        <p class="eyebrow">Personal Study App</p>
        <h1>資格学習ハブ</h1>
        <p>Security+・CCNA・LinuC-1 を同じ UI で学ぶ。配点や受験日程は扱いません。</p>
        <div class="meta-row">
          <span class="chip">3 資格</span>
          <span class="chip">GitHub Pages</span>
        </div>
      </header>
      <section class="chapter-grid hub-grid">
        <a class="chapter-card" href="security-plus/index.html">
          <div class="code">SECURITY+</div>
          <h2>CompTIA Security+</h2>
          <p>SY0-701 · 覚えるモード · 知識マップ</p>
        </a>
        <a class="chapter-card" href="ccna/index.html">
          <div class="code">CCNA</div>
          <h2>CCNA 実務学習</h2>
          <p>200-301 · 教科書 · 小テスト</p>
        </a>
        <a class="chapter-card" href="linuc-1/index.html">
          <div class="code">LINUC-1</div>
          <h2>LinuC-1 実務学習</h2>
          <p>Level 1 · 教科書 · 小テスト</p>
        </a>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
