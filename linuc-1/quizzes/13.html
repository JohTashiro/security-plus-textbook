      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "ゲストごとにカーネルを持つことが多いのはどれか。", "type": "single", "choices": ["仮想マシン", "だけエイリアス", "だけ umask", "だけ PIPESTATUS"], "answer": "A", "explain": "ゲストカーネルは VM。"}, {"id": "Q2", "stem": "ホストのカーネルを共有してアプリを隔離する寄りなのはどれか。", "type": "single", "choices": ["コンテナ", "だけ GPT パーティション名", "だけ chrony プール名", "だけ logrotate 周期名"], "answer": "A", "explain": "カーネル共有はコンテナ。"}, {"id": "Q3", "stem": "Linux 上のハイパーバイザー技術として適切な例はどれか。", "type": "single", "choices": ["KVM", "だけ `echo`", "だけ `passwd`", "だけ `lsblk` がハイパーバイザーそのもの"], "answer": "A", "explain": "Linux では KVM が代表。"}, {"id": "Q4", "stem": "通常 OS の上に載せる仮想化ソフトの例として近いのはどれか。", "type": "single", "choices": ["VirtualBox（ホスト型の例）", "だけ `/etc/fstab`", "だけ `ufw`", "だけ `nmcli` がハイパーバイザー必須条件"], "answer": "A", "explain": "VirtualBox はホスト型例。"}, {"id": "Q5", "stem": "自分が VM／コンテナ上かを見る定番に近いのはどれか。", "type": "single", "choices": ["`systemd-detect-virt`", "`useradd` のみ", "`chage` のみ", "`visudo` のみ"], "answer": "A", "explain": "detect-virt で検知。"}, {"id": "Q6", "stem": "コンテナを起動する docker の例として適切なのはどれか。", "type": "single", "choices": ["`docker container run ...`", "`mkfs.ext4` のみ", "`fdisk` のみ", "`systemctl isolate` のみ"], "answer": "A", "explain": "起動は container run。"}, {"id": "Q7", "stem": "VM とコンテナの比較として適切なものを選べ。", "type": "multi", "choices": ["コンテナは一般に起動が軽い", "VM は強い隔離向きの場面が多い", "コンテナはホストカーネル共有が基本", "コンテナは必ず別ハードウェアが1台必要"], "answer": "A, B, C", "explain": "別ハード必須ではない。"}, {"id": "Q8", "stem": "docker 操作として適切なものを選べ。", "type": "multi", "choices": ["`docker container ls` で一覧", "イメージとコンテナは役割が違う", "`-p` でポート公開できる", "docker は DNS の MX そのもの"], "answer": "A, B, C", "explain": "docker≠MX。"}, {"id": "Q9", "stem": "クラウド／運用の注意として適切なものを選べ。", "type": "multi", "choices": ["揮発性ストレージは消える前提で扱う", "特権コンテナは隔離を弱め得る", "ネスト仮想化の制約があり得る", "仮想化すればバックアップは不要"], "answer": "A, B, C", "explain": "バックアップ不要にはならない。"}, {"id": "Q10", "stem": "稼働中コンテナ一覧を見る docker コマンド例を書け。", "type": "text", "choices": [], "answer": "例: `docker container ls`", "explain": "一覧。"}, {"id": "Q11", "stem": "CPU の仮想化支援の手がかりを見るコマンド例を書け。", "type": "text", "choices": [], "answer": "例: `lscpu`", "explain": "仮想化支援の手がかり。"}, {"id": "Q12", "stem": "開発用に捨てやすい Web サーバをすぐ立ち上げたい。最も妥当な初手はどれか。", "type": "single", "choices": ["nginx 等のコンテナを `docker container run` で起動しポートを公開する", "即物理ディスクを初期化して辞める", "全ユーザの SSH 鍵を破棄するだけ", "chrony を止めて時刻をずらすだけ"], "answer": "A", "explain": "手早いのはコンテナ起動。"}]</script>
