      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "実行中プロセスのスナップショットを見る定番はどれか。", "type": "single", "choices": ["`ps`", "`mkfs`", "`useradd`", "`chmod` のみ"], "answer": "A", "explain": "スナップショットは ps。"}, {"id": "Q2", "stem": "名前から PID を探すのに適するのはどれか。", "type": "single", "choices": ["`pgrep`", "`fdisk`", "`lsblk` のみ", "`passwd`"], "answer": "A", "explain": "名前検索は pgrep。"}, {"id": "Q3", "stem": "まず試すべき丁寧な終了シグナルとして適切なのはどれか。", "type": "single", "choices": ["SIGTERM（例: `kill -15`）", "常に即 `kill -9` のみ", "`rm -rf /`", "`shutdown` をプロセス PID に対して"], "answer": "A", "explain": "まず TERM。"}, {"id": "Q4", "stem": "`kill -9` の説明として近いのはどれか。", "type": "single", "choices": ["強制終了で、最後の手段になりやすい", "設定の文法チェック専用", "パッケージ更新専用", "常に最も安全で推奨される第一選択"], "answer": "A", "explain": "-9 は強制・最終手段。"}, {"id": "Q5", "stem": "ログアウト後もジョブを続けやすい例はどれか。", "type": "single", "choices": ["`nohup` や tmux 内実行", "必ず `kill -9` してから放置", "`mkfs` する", "`/etc` を消す"], "answer": "A", "explain": "nohup / tmux が定番。"}, {"id": "Q6", "stem": "`nice -n 10 ./job` の意図に近いのはどれか。", "type": "single", "choices": ["優先度を控えめにしてバッチを走らせる", "ディスクを初期化する", "ユーザを削除する", "ファイアウォールを無効化する"], "answer": "A", "explain": "nice で控えめ実行。"}, {"id": "Q7", "stem": "監視に使うものとして適切なものを選べ。", "type": "multi", "choices": ["`top`", "`uptime`", "`ps aux`", "`iptables -F` を無条件実行"], "answer": "A, B, C", "explain": "iptables -F は監視ではない。"}, {"id": "Q8", "stem": "ジョブ制御について適切なものを選べ。", "type": "multi", "choices": ["`&` でバックグラウンド起動できる", "`jobs` で一覧できる", "`fg` / `bg` で切り替えられる", "ジョブ制御はカーネルコンパイル専用"], "answer": "A, B, C", "explain": "ジョブ制御は対話シェルの基本。"}, {"id": "Q9", "stem": "負荷切り分けとして適切なものを選べ。", "type": "multi", "choices": ["CPU／メモリ上位を `ps` で確認する", "ログを grep 等で絞る", "まず全ディスクを mkfs する", "必要なら TERM の後に KILL を検討する"], "answer": "A, B, D", "explain": "mkfs は切り分け初手ではない。"}, {"id": "Q10", "stem": "プロセスツリーを見るコマンド例を1つ書け。", "type": "text", "choices": [], "answer": "例: `pstree -p`", "explain": "ツリー表示。"}, {"id": "Q11", "stem": "PID 1234 に TERM を送るコマンド例を書け。", "type": "text", "choices": [], "answer": "例: `kill -15 1234` または `kill 1234`", "explain": "TERM。"}, {"id": "Q12", "stem": "Web サーバが応答しない。`top` で `httpd` が CPU を占有している。設定変更のあとなので優雅に止めたい。最も妥当な初手はどれか。", "type": "single", "choices": ["該当 PID に `kill`（TERM）し、落ちなければサービス経由の再起動やログ確認へ進む", "即 `mkfs` でルートを消す", "全ユーザを `userdel` する", "ケーブルの色を変えるだけ"], "answer": "A", "explain": "まず TERM／サービス再起動とログ。"}]</script>
