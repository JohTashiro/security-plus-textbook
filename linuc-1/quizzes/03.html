      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "標準出力をファイルへ上書き保存する記号はどれか。", "type": "single", "choices": ["`>>`", "`>`", "`\\|`", "`2>`"], "answer": "B", "explain": "`>` は上書き。`>>` は追記。"}, {"id": "Q2", "stem": "左コマンドの出力を右コマンドの入力にするのはどれか。", "type": "single", "choices": ["`>`", "`<`", "`\\|`", "`&&` のみ"], "answer": "C", "explain": "パイプは `\\"}, {"id": "Q3", "stem": "実行中のフォアグラウンドを一時停止するキーはどれか。", "type": "single", "choices": ["`Ctrl+Z`", "`Ctrl+D` のみが停止", "`Alt+F4`（Linux シェル標準）", "`Esc Esc Esc`"], "answer": "A", "explain": "サスペンドは Ctrl+Z。"}, {"id": "Q4", "stem": "ログアウト後もプロセスを続けやすい古典的手段はどれか。", "type": "single", "choices": ["`nohup command &`", "`rm -rf /`", "`chmod 000 /etc`", "`halt` を繰り返す"], "answer": "A", "explain": "nohup とバックグラウンドが定番。"}, {"id": "Q5", "stem": "tmux の主な利点として最も適切なのはどれか。", "type": "single", "choices": ["ディスクを自動で暗号化しないと使えない", "SSH 切断後もセッションを残して再接続できる", "IP アドレスを自動でルーティングする", "systemd の代替である"], "answer": "B", "explain": "tmux は切断耐性とセッション復帰が強み。"}, {"id": "Q6", "stem": "変数を展開せず文字どおりに扱うのに適しているのはどれか。", "type": "single", "choices": ["ダブルクォートのみ", "シングルクォート", "クォートなしの空白だらけ文字列", "`>` リダイレクト"], "answer": "B", "explain": "シングルクォートは展開しない。"}, {"id": "Q7", "stem": "リダイレクトについて適切なものを選べ。", "type": "multi", "choices": ["`>>` は追記", "`2>` は標準エラー向け", "`2>&1` でエラーを出力と同じ行き先にまとめられる", "`>` は常に追記のみ"], "answer": "A, B, C", "explain": "`>` は上書きであり常に追記ではない。"}, {"id": "Q8", "stem": "作業効率化として適切なものを選べ。", "type": "multi", "choices": ["`Ctrl+R` で履歴検索", "`history` で履歴表示", "危険コマンドでも確認せず `!!` を連打する", "`type` や `which` でコマンドの種類・場所を確認する"], "answer": "A, B, D", "explain": "危険コマンドの無確認再実行は不可。"}, {"id": "Q9", "stem": "ジョブ制御について適切なものを選べ。", "type": "multi", "choices": ["`jobs` で一覧", "`bg` でバックグラウンド再開", "`fg` でフォアグラウンドに戻す", "`&` を付けると必ず root 権限になる"], "answer": "A, B, C", "explain": "`&` は権限を上げない。"}, {"id": "Q10", "stem": "現在のディレクトリを表示するコマンドを書け。", "type": "text", "choices": [], "answer": "`pwd`", "explain": "Print Working Directory。"}, {"id": "Q11", "stem": "`journalctl -u ssh` の出力をページャで見るパイプ例を1つ書け。", "type": "text", "choices": [], "answer": "例: `journalctl -u ssh \\", "explain": "less`"}, {"id": "Q12", "stem": "本番サーバへ SSH し、長時間のログ収集を走らせている。回線が不安定で切れそうだ。最も適切なのはどれか。", "type": "single", "choices": ["tmux（または screen）内で作業し、切れてもアタッチし直せるようにする", "ルートファイルシステムをフォーマットする", "すべてのユーザを削除する", "ファイアウォールを止めっぱなしにする"], "answer": "A", "explain": "不安定回線ではマルチプレクサ内作業が基本。"}]</script>
