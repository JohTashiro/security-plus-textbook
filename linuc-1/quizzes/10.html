      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "現行 Linux でアドレス表示の定番に近いのはどれか。", "type": "single", "choices": ["`ip addr`", "`useradd` のみ", "`mkfs` のみ", "`passwd` のみ"], "answer": "A", "explain": "現行は ip addr。"}, {"id": "Q2", "stem": "RHEL 系で接続を操作する定番ツールはどれか。", "type": "single", "choices": ["`nmcli`（NetworkManager）", "だけ `fdisk`", "だけ `chage`", "だけ `tar`"], "answer": "A", "explain": "RHEL 系は nmcli。"}, {"id": "Q3", "stem": "Ubuntu 系で YAML を置き `apply` する仕組みとして適切なのはどれか。", "type": "single", "choices": ["Netplan", "だけ LVM スナップショット名", "だけ SELinux 壁紙", "だけ cron 色"], "answer": "A", "explain": "Ubuntu 系は Netplan。"}, {"id": "Q4", "stem": "firewalld で設定を永続化したあと効かせる定番はどれか。", "type": "single", "choices": ["`firewall-cmd --reload`", "`rm -rf /`", "`chmod 777 /etc/shadow`", "`swapoff -a` のみ"], "answer": "A", "explain": "永続後は --reload。"}, {"id": "Q5", "stem": "Ubuntu 系ホストファイアウォールの定番はどれか。", "type": "single", "choices": ["`ufw`", "だけ `lsblk`", "だけ `du`", "だけ `visudo` が FW そのもの"], "answer": "A", "explain": "Ubuntu FW は ufw。"}, {"id": "Q6", "stem": "待ち受けポート確認の定番に近いのはどれか。", "type": "single", "choices": ["`ss -tlnp`", "だけ `history`", "だけ `alias`", "だけ `uname -r` の色"], "answer": "A", "explain": "待ち受けは ss。"}, {"id": "Q7", "stem": "切り分け順序として適切なものを選べ。", "type": "multi", "choices": ["リンク状態", "アドレスと経路", "名前解決と FW", "いきなりディスク初期化"], "answer": "A, B, C", "explain": "いきなり初期化は不可。"}, {"id": "Q8", "stem": "DNS／名前解決で適切なものを選べ。", "type": "multi", "choices": ["`/etc/hosts` はローカル上書きに使える", "解けないのと届かないを分ける", "`resolvectl` が使える環境がある", "DNS は常に LVM の VG 名"], "answer": "A, B, C", "explain": "DNS≠VG 名。"}, {"id": "Q9", "stem": "ファイアウォール運用として適切なものを選べ。", "type": "multi", "choices": ["必要サービス／ポートだけ許可", "永続化と再読込を意識する", "状態確認コマンドを先に打つ", "全拒否も全開放も考えず常に全開放"], "answer": "A, B, C", "explain": "常時全開放は不適切。"}, {"id": "Q10", "stem": "デフォルトゲートウェイを見る `ip` コマンド例を書け。", "type": "text", "choices": [], "answer": "例: `ip route`", "explain": "経路確認。"}, {"id": "Q11", "stem": "ufw で SSH（22/tcp）を許可する例を書け。", "type": "text", "choices": [], "answer": "例: `ufw allow 22/tcp`", "explain": "SSH 許可。"}, {"id": "Q12", "stem": "ブラウザで名前は解決できるがサイトに届かない。同網 GW へは ping 可。サーバで `ss` は 80 待ち受けあり。次に疑う定番はどれか。", "type": "single", "choices": ["ホスト FW で 80/http が塞がれていないか確認する", "即ルートを mkfs する", "全ユーザを削除する", "SSH を Telnet に戻す"], "answer": "A", "explain": "名前可・待ち受け有なら FW 疑う。"}]</script>
