      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "パスワードハッシュが置かれる代表ファイルはどれか。", "type": "single", "choices": ["`/etc/shadow`", "`/etc/hosts` のみ", "`/proc/cpuinfo` のみ", "`/dev/null`"], "answer": "A", "explain": "ハッシュは shadow。"}, {"id": "Q2", "stem": "ホーム付きユーザを作る定番に近いのはどれか。", "type": "single", "choices": ["`useradd -m`", "`mkfs` のみ", "`ip link set down` のみ", "`fdisk` のみ"], "answer": "A", "explain": "ホーム作成は -m。"}, {"id": "Q3", "stem": "パスワード有効期限を見る・変える定番はどれか。", "type": "single", "choices": ["`chage`", "`tar` のみ", "`ping` のみ", "`lsblk` のみ"], "answer": "A", "explain": "期限は chage。"}, {"id": "Q4", "stem": "sudoers を安全に編集する定番はどれか。", "type": "single", "choices": ["`visudo`", "`rm -rf /etc`", "`chmod 777 /etc/shadow`", "`echo` で shadow を上書き"], "answer": "A", "explain": "安全編集は visudo。"}, {"id": "Q5", "stem": "サーバ側で公開鍵を置く定番ファイルはどれか。", "type": "single", "choices": ["`~/.ssh/authorized_keys`", "`/etc/fstab` のみ", "`/var/log/wtmp` のみ", "`~/.bashrc` のみが唯一"], "answer": "A", "explain": "公開鍵は authorized_keys。"}, {"id": "Q6", "stem": "攻撃面を減らす初手として適切なのはどれか。", "type": "single", "choices": ["不要サービスを停止・無効化", "全ポートを無条件開放し続ける", "root パスワードを全員で共有する", "SSH を平文 Telnet に戻す"], "answer": "A", "explain": "不要サービス停止が基本。"}, {"id": "Q7", "stem": "アカウント関連で適切なものを選べ。", "type": "multi", "choices": ["`/etc/passwd` はアカウント属性", "`/etc/group` はグループ", "`id` で UID/GID を確認できる", "パスワードを世界読み可能にする"], "answer": "A, B, C", "explain": "世界読みパスワードは不可。"}, {"id": "Q8", "stem": "SSH 鍵認証で適切なものを選べ。", "type": "multi", "choices": ["秘密鍵は秘匿する", "公開鍵を authorized_keys に置く", "`ssh-keygen` で鍵を作れる", "秘密鍵をチャットに貼る"], "answer": "A, B, C", "explain": "秘密鍵を晒さない。"}, {"id": "Q9", "stem": "sudo 運用として適切なものを選べ。", "type": "multi", "choices": ["個人アカウントで操作を監査しやすくする", "権限は必要最小限にする", "`sudo -l` で許可を確認できる", "全員に NOPASSWD: ALL を無批判で付ける"], "answer": "A, B, C", "explain": "無制限 NOPASSWD は危険。"}, {"id": "Q10", "stem": "ユーザ `alice` をグループ `developers` に追加する `usermod` 例を書け。", "type": "text", "choices": [], "answer": "例: `usermod -aG developers alice`", "explain": "追加グループ。"}, {"id": "Q11", "stem": "現在のログイン状況を見るコマンドを1つ書け。", "type": "text", "choices": [], "answer": "例: `who` / `w`", "explain": "ログイン状況。"}, {"id": "Q12", "stem": "外部からパスワード総当たりが来ている。鍵は配布済み。最も妥当な初動の一つはどれか。", "type": "single", "choices": ["PasswordAuthentication を無効化し鍵認証中心にする（方針に沿って）", "即 `rm -rf /`", "ファイアウォールを全て止める", "shadow を世界読み可能にする"], "answer": "A", "explain": "鍵中心化は総当たり緩和。"}]</script>
