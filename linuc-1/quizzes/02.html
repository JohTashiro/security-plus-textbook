        <h1>起動とランレベル systemd</h1>
        <p>本番寄りの形式です。選ぶとすぐ判定されます（12問）。</p>
        <div class="action-row">

        </div>
      </header>
      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "現行の多くの Linux で PID 1 として動くのはどれか。", "type": "single", "choices": ["cron だけ", "systemd", "nginx", "sshd のみ"], "answer": "B", "explain": "現行の多くのディストリで PID 1 は systemd。"}, {"id": "Q2", "stem": "ブート時にサービスを自動起動する設定にする基本コマンドはどれか。", "type": "single", "choices": ["`systemctl enable サービス`", "`chmod 777 /`", "`userdel -r root`", "`mkfs` をルートに実行"], "answer": "A", "explain": "自動起動は `systemctl enable`。"}, {"id": "Q3", "stem": "GUI なしの通常サーバ運用でよく使うターゲットはどれか。", "type": "single", "choices": ["`emergency.target` のみ常時", "`multi-user.target`", "`swap.target` だけ", "`shutdown.target` をデフォルトにする"], "answer": "B", "explain": "サーバは `multi-user.target` が定番。"}, {"id": "Q4", "stem": "サービス単位のログを見るのに適したコマンドはどれか。", "type": "single", "choices": ["`journalctl -u サービス名`", "`ping -c 1 127.0.0.1` のみ", "`passwd`", "`lsblk`"], "answer": "A", "explain": "単位ログは `journalctl -u`。"}, {"id": "Q5", "stem": "systemd のタイマーについて適切なのはどれか。", "type": "single", "choices": ["時間起動の仕組みで、対応する service と組で使うことが多い", "ディスクパーティション形式の名前である", "NIC のボンディング専用である", "UEFI の必須パーティション名である"], "answer": "A", "explain": "timer は service と組で時間起動する。"}, {"id": "Q6", "stem": "起動の一般的な順序として正しいものはどれか。", "type": "single", "choices": ["systemd → カーネル → ファームウェア", "ファームウェア → ブートローダ → カーネル → systemd", "アプリ → BIOS → カーネル", "Docker → GRUB → 電源"], "answer": "B", "explain": "ファーム → ブートローダ → カーネル → systemd。"}, {"id": "Q7", "stem": "`systemctl` で行う操作として適切なものを選べ。", "type": "multi", "choices": ["`start` / `stop` / `restart`", "`status` で状態確認", "`enable` / `disable` で自動起動制御", "`mkfs.ext4` の代替になる"], "answer": "A, B, C", "explain": "systemctl は mkfs の代替ではない。"}, {"id": "Q8", "stem": "修復・緊急時に関係しやすいターゲットを選べ。", "type": "multi", "choices": ["`rescue.target`", "`emergency.target`", "`graphical.target` を常に緊急用と呼ぶ", "デフォルトターゲットの確認に `systemctl get-default`"], "answer": "A, B, D", "explain": "graphical は緊急専用ではない。"}, {"id": "Q9", "stem": "タイマー運用について適切なものを選べ。", "type": "multi", "choices": ["`systemctl list-timers` で一覧できる", "cron と併存する環境もある", "Version 11.0 では特に意識しやすい", "タイマーを使うと SSH が不要になる"], "answer": "A, B, C", "explain": "タイマー利用で SSH が不要にはならない。"}, {"id": "Q10", "stem": "現在のデフォルトターゲットを表示するコマンドを書け。", "type": "text", "choices": [], "answer": "`systemctl get-default`", "explain": "デフォルトターゲット表示。"}, {"id": "Q11", "stem": "`sshd`（または `ssh`）サービスが稼働中か確認する `systemctl` コマンド例を1つ書け。", "type": "text", "choices": [], "answer": "例: `systemctl status sshd` または `systemctl is-active ssh`", "explain": "ディストリで単位名が違う点に注意。"}, {"id": "Q12", "stem": "サーバ再起動後に Web サーバが応答しない。プロセスもいない。パッケージは入っている。最初に確認すべきこととして最も適切なのはどれか。", "type": "single", "choices": ["`systemctl status` と `is-enabled` でサービス状態と自動起動を確認する", "すべてのディスクを初期化する", "ルートのパスワードを空にする", "カーネルを毎日再コンパイルする運用に切り替える"], "answer": "A", "explain": "再起動後に落ちる典型は enable 忘れ・起動失敗。status から入る。"}]</script>
