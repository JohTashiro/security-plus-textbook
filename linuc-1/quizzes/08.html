      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "ブロックデバイスのツリー表示に使う定番はどれか。", "type": "single", "choices": ["`lsblk`", "`passwd`", "`userdel`", "`chmod 777` のみ"], "answer": "A", "explain": "デバイス一覧は lsblk。"}, {"id": "Q2", "stem": "UEFI 起動で必要になりやすい特別なパーティションはどれか。", "type": "single", "choices": ["ESP（EFI System Partition）", "だけ swap という名前のユーザ", "だけ `/tmp` の色情報", "だけ `PATH` 変数"], "answer": "A", "explain": "UEFI は ESP が典型。"}, {"id": "Q3", "stem": "ext4 を作る典型コマンドはどれか。", "type": "single", "choices": ["`mkfs.ext4`", "`systemctl isolate`", "`tmux`", "`grep`"], "answer": "A", "explain": "ext4 作成は mkfs.ext4。"}, {"id": "Q4", "stem": "スワップを有効化するコマンドはどれか。", "type": "single", "choices": ["`swapon`", "`apt update` のみ", "`kill -9` のみ", "`echo` のみ"], "answer": "A", "explain": "有効化は swapon。"}, {"id": "Q5", "stem": "ブート時の自動マウント設定の中心ファイルはどれか。", "type": "single", "choices": ["`/etc/fstab`", "`/etc/hostname` のフォント", "`/dev/null` の色", "`~/.bashrc` のみが唯一"], "answer": "A", "explain": "永続マウントは fstab。"}, {"id": "Q6", "stem": "LVM で複数 PV を束ねる層はどれか。", "type": "single", "choices": ["VG（Volume Group）", "だけ inode 番号の色", "だけ SELinux の壁紙", "だけ DNS MX"], "answer": "A", "explain": "束ねるのは VG。"}, {"id": "Q7", "stem": "容量調査として適切なものを選べ。", "type": "multi", "choices": ["`df -h`", "`du -sh`", "`df -i`（i ノード）", "ルートを毎回 `mkfs` する"], "answer": "A, B, C", "explain": "ルート mkfs は調査ではない。"}, {"id": "Q8", "stem": "マウント運用として適切なものを選べ。", "type": "multi", "choices": ["`mount` / `umount`", "UUID を fstab に使う", "`blkid` で UUID 確認", "fstab を理由なく空にする"], "answer": "A, B, C", "explain": "fstab を空にするのは危険。"}, {"id": "Q9", "stem": "LVM の利点・概念として適切なものを選べ。", "type": "multi", "choices": ["論理ボリュームの拡張がしやすい", "PV / VG / LV の層がある", "層が増え手順が複雑になり得る", "LVM は DNS の A レコードそのもの"], "answer": "A, B, C", "explain": "LVM≠DNS レコード。"}, {"id": "Q10", "stem": "デバイス `/dev/sdb1` の UUID を見るコマンド例を書け。", "type": "text", "choices": [], "answer": "例: `blkid /dev/sdb1`", "explain": "UUID 確認。"}, {"id": "Q11", "stem": "ディレクトリ使用量を要約表示する `du` 例を書け。", "type": "text", "choices": [], "answer": "例: `du -sh /var/log`", "explain": "使用量要約。"}, {"id": "Q12", "stem": "`df -h` では空きがあるのに新規ファイルが作れない。次に見るべき定番はどれか。", "type": "single", "choices": ["`df -i` で i ノード枯渇を疑う", "即 `rm -rf /`", "全ユーザのパスワードを空にする", "ケーブルの色を変える"], "answer": "A", "explain": "空き有り作成不可は i ノード疑う。"}]</script>
