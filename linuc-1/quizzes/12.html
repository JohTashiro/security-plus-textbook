        <h1>シェルスクリプト</h1>
        <p>本番寄りの形式です。選ぶとすぐ判定されます（12問）。</p>
        <div class="action-row">
          <a class="btn btn-ghost" href="../chapters/12.html">教科書に戻る</a>
        </div>
      </header>
      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "bash スクリプト先頭の `#!/bin/bash` の役割はどれか。", "type": "single", "choices": ["インタプリタ指定（shebang）", "ファイアウォール規則そのもの", "LVM の PV 名そのもの", "DNS の PTR そのもの"], "answer": "A", "explain": "shebang はインタプリタ指定。"}, {"id": "Q2", "stem": "空白を含む値を安全に展開しやすいのはどれか。", "type": "single", "choices": ["`\"$var\"`", "常に未引用の `$var` が最も安全", "`mkfs \"$var\"` が変数の定義", "`userdel` が引用の意味"], "answer": "A", "explain": "引用で空白を保持。"}, {"id": "Q3", "stem": "成功時の慣習的な終了コードはどれか。", "type": "single", "choices": ["0", "必ず 255 のみ", "必ず -1 のみ", "文字列 \"OK\" のみが終了コード"], "answer": "A", "explain": "成功は 0。"}, {"id": "Q4", "stem": "構文チェックに使う定番はどれか。", "type": "single", "choices": ["`bash -n script.sh`", "`rm -rf /`", "`chmod 777 /etc/shadow`", "`swapoff` のみ"], "answer": "A", "explain": "構文は bash -n。"}, {"id": "Q5", "stem": "実行トレースに使う定番はどれか。", "type": "single", "choices": ["`bash -x script.sh`", "`ip route` のみ", "`nmcli` のみ", "`ufw` のみ"], "answer": "A", "explain": "トレースは bash -x。"}, {"id": "Q6", "stem": "全引数を安全に渡す定番はどれか。", "type": "single", "choices": ["`\"$@\"`", "だけ `$#` が実体の全引数配列", "だけ `$0` が全引数", "だけ `$?` が全引数"], "answer": "A", "explain": "全引数は \"$@\"。"}, {"id": "Q7", "stem": "堅牢化として適切なものを選べ。", "type": "multi", "choices": ["`set -euo pipefail` を検討する", "パスを引用する", "秘密を直書きしない", "エラーを無視して常に成功扱いする"], "answer": "A, B, C", "explain": "エラー無視は不適切。"}, {"id": "Q8", "stem": "条件・分岐として適切なものを選べ。", "type": "multi", "choices": ["`[[ -f file ]]`", "`if ...; then ...; fi`", "非0 で失敗を表せる", "終了コードは常に無意味"], "answer": "A, B, C", "explain": "終了コードは意味がある。"}, {"id": "Q9", "stem": "ループとして適切なものを選べ。", "type": "multi", "choices": ["`for f in ...; do ...; done`", "`while read -r line; do ...; done`", "存在しない glob に注意する", "ループはカーネルの唯一のスケジューラ"], "answer": "A, B, C", "explain": "ループ≠カーネルスケジューラ。"}, {"id": "Q10", "stem": "第1引数を変数 `src` に入れる代入例を書け。", "type": "text", "choices": [], "answer": "例: `src=$1` または `src=${1:?}`", "explain": "第1引数。"}, {"id": "Q11", "stem": "ファイルが存在するときだけ中の処理をする `if` の条件例を書け。", "type": "text", "choices": [], "answer": "例: `[[ -f file ]]`", "explain": "ファイル存在。"}, {"id": "Q12", "stem": "スクリプトが「ファイル名に空白があると壊れる」。最も妥当な修正方針はどれか。", "type": "single", "choices": ["変数と引数を適切に引用し、`\"$@\"` や `read -r` を使う", "即 `rm -rf /`", "全ファイル名を禁止するしかない", "shebang を削除すれば解決する"], "answer": "A", "explain": "空白対策は引用。"}]</script>
