      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "長いファイルをページ単位で読むのに適するのはどれか。", "type": "single", "choices": ["`less`", "`mkfs`", "`systemctl isolate`", "`useradd`"], "answer": "A", "explain": "ページングは less。"}, {"id": "Q2", "stem": "ファイル末尾20行を見る定番はどれか。", "type": "single", "choices": ["`tail -n 20 file`", "`head` の別名だけ", "`chmod 777`", "`ip link`"], "answer": "A", "explain": "末尾は tail -n。"}, {"id": "Q3", "stem": "大文字小文字を無視して検索する grep の典型はどれか。", "type": "single", "choices": ["`grep -i`", "`grep -F` のみで常に無視", "`grep` にオプションは無い", "`kill -9`"], "answer": "A", "explain": "無視は -i。"}, {"id": "Q4", "stem": "拡張正規表現を使う grep の現代的な書き方はどれか。", "type": "single", "choices": ["`grep -E`", "常に `mkfs -E`", "`ping -E`", "`mount -E`"], "answer": "A", "explain": "拡張正規表現は grep -E。"}, {"id": "Q5", "stem": "`sed 's/foo/bar/g'` の `g` の意味に近いのはどれか。", "type": "single", "choices": ["行内の該当をすべて置換", "ファイルを必ず削除", "プロセスを kill", "パッケージを更新"], "answer": "A", "explain": "g は行内グローバル置換。"}, {"id": "Q6", "stem": "vi で挿入モードからコマンドモードへ戻るキーはどれか。", "type": "single", "choices": ["`Esc`", "常に `Ctrl+C` のみ", "`shutdown`", "`fg`"], "answer": "A", "explain": "Esc でコマンドモードへ。"}, {"id": "Q7", "stem": "テキストフィルタとして適切なものを選べ。", "type": "multi", "choices": ["`cut`", "`sort`", "`uniq`", "`fdisk`（パーティション操作用）"], "answer": "A, B, C", "explain": "fdisk はテキストフィルタではない。"}, {"id": "Q8", "stem": "正規表現・検索について適切なものを選べ。", "type": "multi", "choices": ["`^` は行頭のイメージ", "`grep -F` は固定文字列向き", "`grep -v` は不一致行を出せる", "正規表現は常にバイナリ専用"], "answer": "A, B, C", "explain": "正規表現はテキスト検索が主。"}, {"id": "Q9", "stem": "安全な運用として適切なものを選べ。", "type": "multi", "choices": ["`sed -i` の前に出力だけ確認する", "本番設定はバックアップを検討する", "ログ全体を無条件に消してから考える", "`less` で巨大ログを開いてから絞る"], "answer": "A, B, D", "explain": "ログを無条件削除してから考えない。"}, {"id": "Q10", "stem": "行数を数える基本コマンドを書け（オプション付き可）。", "type": "text", "choices": [], "answer": "例: `wc -l`", "explain": "行数カウント。"}, {"id": "Q11", "stem": "ファイル内の `error` を含む行を出す `grep` 例を1つ書け。", "type": "text", "choices": [], "answer": "例: `grep error file`", "explain": "パターン検索。"}, {"id": "Q12", "stem": "Web のアクセスログから、同一 IP の出現回数を多い順に見たい。最も近いパイプラインはどれか。", "type": "single", "choices": ["`awk '{print $1}' access.log | sort | uniq -c | sort -nr | head`", "`chmod -R 777 /`", "`systemctl poweroff`", "`mkfs` をログに対して実行する"], "answer": "A", "explain": "列抽出→sort→uniq -c→再ソート。"}]</script>
