        <h1>パッケージ管理</h1>

      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "Debian 系でインデックス更新に使う定番はどれか。", "type": "single", "choices": ["`apt update`", "`mkfs`", "`userdel`", "`ip link set down`"], "answer": "A", "explain": "索引更新は apt update。"}, {"id": "Q2", "stem": "Debian 系でパッケージを入れる高水準コマンドとして適切なのはどれか。", "type": "single", "choices": ["`apt install`", "常に `fdisk` のみ", "`passwd` のみ", "`kill -9` のみ"], "answer": "A", "explain": "導入は apt install。"}, {"id": "Q3", "stem": "個別の `.deb` を直接扱う低水準ツールはどれか。", "type": "single", "choices": ["`dpkg`", "`systemctl isolate`", "`tmux`", "`grep`"], "answer": "A", "explain": ".deb 直接は dpkg。"}, {"id": "Q4", "stem": "RHEL 系クローンで現行主流になりやすい高水準ツールはどれか。", "type": "single", "choices": ["`dnf`（yum 互換も）", "`apt-get` のみが唯一", "`sed` のみ", "`less` のみ"], "answer": "A", "explain": "現行 RHEL 系は dnf が主流。"}, {"id": "Q5", "stem": "あるファイルがどの RPM パッケージ提供かを調べる例はどれか。", "type": "single", "choices": ["`rpm -qf /path` または `dnf provides`", "`chmod 777 /path` のみ", "`shutdown`", "`passwd`"], "answer": "A", "explain": "rpm -qf / dnf provides。"}, {"id": "Q6", "stem": "Debian 系のリポジトリ設定の代表的な場所はどれか。", "type": "single", "choices": ["`/etc/apt/sources.list`（および `sources.list.d/`）", "`/proc/cpuinfo` のみ", "`/dev/null`", "`/boot` の色情報"], "answer": "A", "explain": "sources.list 系。"}, {"id": "Q7", "stem": "パッケージ調査として適切なものを選べ。", "type": "multi", "choices": ["内容一覧（`dpkg -L` / `rpm -ql`）", "情報表示（`apt show` / `dnf info`）", "ファイルの所有者パッケージ検索", "ルートファイルシステムを毎回 mkfs"], "answer": "A, B, C", "explain": "mkfs は調査手段ではない。"}, {"id": "Q8", "stem": "RPM 系について適切なものを選べ。", "type": "multi", "choices": ["リポジトリ定義は `/etc/yum.repos.d/` にあることが多い", "`rpm` は低水準操作向き", "依存解決は `dnf` に任せると安全なことが多い", "`rpm -qa` はインストール済み一覧に使える"], "answer": "A, B, C, D", "explain": "いずれも適切な理解。"}, {"id": "Q9", "stem": "本番運用として適切なものを選べ。", "type": "multi", "choices": ["更新前に何が変わるか確認する", "変更理由とロールバックを意識する", "理由なく未知の第三リポジトリを大量追加する", "カーネル更新後の再起動要否を確認する"], "answer": "A, B, D", "explain": "未知リポジトリの大量追加は危険。"}, {"id": "Q10", "stem": "導入済み Debian パッケージ一覧の基本コマンドを1つ書け。", "type": "text", "choices": [], "answer": "例: `dpkg -l`", "explain": "一覧。"}, {"id": "Q11", "stem": "RPM 系でパッケージ `nginx` を入れる `dnf` 例を書け。", "type": "text", "choices": [], "answer": "例: `sudo dnf install nginx`", "explain": "導入。"}, {"id": "Q12", "stem": "`dpkg -i app.deb` が依存不足で失敗した。最も妥当な次の一手はどれか。", "type": "single", "choices": ["`apt -f install` などで依存を解決・修復する", "即 `rm -rf /`", "全ユーザのパスワードを空にする", "SELinux を理由にディスクを初期化する"], "answer": "A", "explain": "依存不足は apt -f で修復が定番。"}]</script>
