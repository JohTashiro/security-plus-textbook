        <h1>サービスとログ</h1>

      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "サービス状態確認の定番はどれか。", "type": "single", "choices": ["`systemctl status`", "`mkfs` のみ", "`useradd` のみ", "`fdisk` のみ"], "answer": "A", "explain": "状態は systemctl status。"}, {"id": "Q2", "stem": "起動時有効化の定番はどれか。", "type": "single", "choices": ["`systemctl enable`", "`chmod 777 /`", "`swapoff -a` のみ", "`history -c` のみ"], "answer": "A", "explain": "自動起動は enable。"}, {"id": "Q3", "stem": "特定ユニットの journal を見る例に近いのはどれか。", "type": "single", "choices": ["`journalctl -u nginx`", "`passwd nginx` のみ", "`ip link set down` のみ", "`visudo` のみ"], "answer": "A", "explain": "ユニット指定は -u。"}, {"id": "Q4", "stem": "ログのローテ・圧縮を担う定番ツールはどれか。", "type": "single", "choices": ["`logrotate`", "だけ `ping`", "だけ `traceroute`", "だけ `nmcli`"], "answer": "A", "explain": "ローテは logrotate。"}, {"id": "Q5", "stem": "RHEL 系で時刻同期の現行主流に近いのはどれか。", "type": "single", "choices": ["chrony（`chronyc`）", "だけ PortFast", "だけ LACP", "だけ WPA チャネル名"], "answer": "A", "explain": "RHEL 系は chrony 寄り。"}, {"id": "Q6", "stem": "systemd timer の説明として適切なのはどれか。", "type": "single", "choices": ["いつ起動するかを定義し、対応する service を動かす", "ファイアウォールそのもの", "LVM の VG 名そのもの", "DNS の MX レコードそのもの"], "answer": "A", "explain": "timer が起動契機。"}, {"id": "Q7", "stem": "systemd 運用として適切なものを選べ。", "type": "multi", "choices": ["`daemon-reload` をユニット変更後に意識する", "`is-active` / `is-enabled` で状態確認", "`/etc/systemd/system/` は管理者上書き寄り", "ユニットを理由なく全部 mask し続ける"], "answer": "A, B, C", "explain": "無差別 mask は不適切。"}, {"id": "Q8", "stem": "ログ調査として適切なものを選べ。", "type": "multi", "choices": ["`journalctl -f` で追跡", "優先度フィルタ（例: `-p err`）", "`/var/log` 配下も見る", "ログを見ずにディスクを初期化する"], "answer": "A, B, C", "explain": "初期化は調査ではない。"}, {"id": "Q9", "stem": "時刻について適切なものを選べ。", "type": "multi", "choices": ["ずれはログ相関を壊す", "`timedatectl` で概況を見られる", "chrony は現行主流の一つ", "時刻はセキュリティに無関係"], "answer": "A, B, C", "explain": "時刻はセキュリティにも影響。"}, {"id": "Q10", "stem": "nginx を再起動する `systemctl` 例を書け。", "type": "text", "choices": [], "answer": "例: `systemctl restart nginx`", "explain": "再起動。"}, {"id": "Q11", "stem": "直近1時間の journal に絞るオプション例を書け（概念で可）。", "type": "text", "choices": [], "answer": "例: `--since \"1 hour ago\"`", "explain": "時間絞り。"}, {"id": "Q12", "stem": "サービスが自動起動しない。`status` は inactive。最も妥当な確認はどれか。", "type": "single", "choices": ["`systemctl is-enabled` とユニットの失敗ログ（journal）を見る", "即 `rm -rf /var`", "全ユーザパスワードを空にする", "ケーブルの色を変える"], "answer": "A", "explain": "enable 状態と journal を見る。"}]</script>
