      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "CPU のコア数や仮想化関連フラグをまとめて確認するのに適したコマンドはどれか。", "type": "single", "choices": ["`chmod`", "`lscpu`", "`useradd`", "`ping`"], "answer": "B", "explain": "CPU 情報の入口は `lscpu`。"}, {"id": "Q2", "stem": "ブロックデバイスとパーティションの関係を木構造で見るのに適しているのはどれか。", "type": "single", "choices": ["`lsblk`", "`grep`", "`systemctl reboot`", "`passwd`"], "answer": "A", "explain": "ディスクとパーティションの俯瞰は `lsblk`。"}, {"id": "Q3", "stem": "UEFI について適切な説明はどれか。", "type": "single", "choices": ["すでに廃止され一切使われない", "現行マシンで主流のファームウェア／ブート方式の一つ", "ディスク暗号化のファイルシステム名", "Docker のネットワークドライバ名"], "answer": "B", "explain": "UEFI は現行の主流ブート方式の一つ。"}, {"id": "Q4", "stem": "`systemd-detect-virt` が `kvm` を返したとき、最も妥当な解釈はどれか。", "type": "single", "choices": ["物理マシンで仮想化支援が無効", "その環境は KVM 上の仮想マシンとして検出された", "必ず VirtualBox である", "カーネルが壊れている"], "answer": "B", "explain": "`kvm` は KVM 上のゲストとして検出されたことを示す。"}, {"id": "Q5", "stem": "コンテナの説明として最も適切なのはどれか。", "type": "single", "choices": ["必ず専用の物理サーバが1台必要", "ホストのカーネルを共有する軽量な隔離手法が多い", "ゲスト OS を必ずフルインストールする点で VM と同じ", "BIOS の設定項目の名前である"], "answer": "B", "explain": "コンテナはホストカーネル共有の軽量隔離が多い。"}, {"id": "Q6", "stem": "`mkfs` を実行する直前に最も重要な確認はどれか。", "type": "single", "choices": ["壁紙の色", "対象デバイス名が意図したものか（例: `lsblk`）", "DNS の TTL", "画面解像度"], "answer": "B", "explain": "破壊的操作の前にデバイス名の再確認が最重要。"}, {"id": "Q7", "stem": "ハードウェア把握に使えるものを選べ。", "type": "multi", "choices": ["`lspci`", "`lsusb`", "`lscpu`", "`userdel -r`"], "answer": "A, B, C", "explain": "`userdel` はアカウント削除でありハードウェア確認ではない。"}, {"id": "Q8", "stem": "仮想化に関する説明として適切なものを選べ。", "type": "multi", "choices": ["ホスト型は一般的なホスト OS 上に仮想化ソフトを載せるイメージがある", "KVM は Linux でのサーバ仮想化の選択肢の一つ", "`systemd-detect-virt` は仮想化の種類の検出に使える", "VRF は Linux のディスクパーティション形式である"], "answer": "A, B, C", "explain": "VRF は経路の論理分割でありディスク形式ではない。"}, {"id": "Q9", "stem": "「ディスクが見えない」ときの一次切り分けとして適切なものを選べ。", "type": "multi", "choices": ["`lsblk` で認識を確認する", "`lspci` でストレージコントローラが見えるか確認する", "いきなり本番ディスクへ `dd` する", "ケーブル／筐体側の接続も疑う"], "answer": "A, B, D", "explain": "本番ディスクへの不用意な `dd` は不可。"}, {"id": "Q10", "stem": "マシンの CPU アーキテクチャ（例: x86_64）を手早く出すコマンドを1つ書け。", "type": "text", "choices": [], "answer": "`uname -m`（または同等）", "explain": "アーキテクチャ表示。`lscpu` でも可。"}, {"id": "Q11", "stem": "PCI バス上の Ethernet コントローラを探しやすい `lspci` の使い方を1つ書け。（パイプやオプション可）", "type": "text", "choices": [], "answer": "例: `lspci \\", "explain": "grep -i ether`"}, {"id": "Q12", "stem": "新しい検証用 VM にログインした。NIC 名やディスク構成が物理サーバと違う気がする。最初にやる確認として最も適切なのはどれか。", "type": "single", "choices": ["本番ファイアウォールをすべて止める", "`systemd-detect-virt` と `lscpu` / `lsblk` で仮想化の有無とデバイス一覧を確認する", "ルートパスワードを空にする", "`/etc` をすべて削除する"], "answer": "B", "explain": "まず仮想化検出とデバイス一覧で環境差を把握する。"}]</script>
