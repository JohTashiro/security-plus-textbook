      <div id="quiz"></div>
      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "長距離の構内間接続で特に選ばれやすい光ファイバはどれか。", "type": "single", "choices": ["カテゴリ3 UTP のみ", "シングルモード（SMF）", "USB 延長ケーブル", "電話線のクロス結線のみ"], "answer": "B", "explain": "長距離はシングルモードが選ばれやすい。"}, {"id": "Q2", "stem": "スイッチ同士の通常接続で標準的な二重化はどれか。", "type": "single", "choices": ["半二重", "全二重", "二重化なしが必須", "衛星リンク専用モード"], "answer": "B", "explain": "スイッチ接続は全二重が標準。"}, {"id": "Q3", "stem": "片側だけ速度／二重化を固定し、対向が auto のときに起きやすい問題はどれか。", "type": "single", "choices": ["OSPF エリアが自動作成される", "duplex mismatch", "DNS レコードが消える", "VLAN 1 が必ず削除される"], "answer": "B", "explain": "片側固定＋対向 auto は duplex mismatch の典型。"}, {"id": "Q4", "stem": "`show interfaces` で CRC や input errors が増え続けるとき、最初に疑うべき対象として最も近いのはどれか。", "type": "single", "choices": ["ルーティングプロトコルのメトリックだけ", "ケーブル不良・ノイズ・二重化不一致など物理寄り", "NTP の stratum だけ", "無線の SSID 名の長さだけ"], "answer": "B", "explain": "CRC/input errors は物理・二重化を先に疑う。"}, {"id": "Q5", "stem": "Auto-MDIX の効果として適切なのはどれか。", "type": "single", "choices": ["IP アドレスを自動でルーティングする", "ストレート／クロスの配線差を吸収しやすくする", "光ファイバの波長を変換する", "ACL を自動生成する"], "answer": "B", "explain": "Auto-MDIX は MDI/MDIX 差を吸収しやすくする。"}, {"id": "Q6", "stem": "インタフェースが administratively down のとき、まず確認するのはどれか。", "type": "single", "choices": ["`shutdown` されていないか", "BGP AS 番号", "無線チャネル幅のみ", "証明書の SAN"], "answer": "A", "explain": "administratively down は shutdown 状態を疑う。"}, {"id": "Q7", "stem": "銅線 Ethernet について適切なものを選べ。", "type": "multi", "choices": ["おおむね 100m 程度の長さ制限を意識する", "カテゴリ不足や劣化で誤りが増え得る", "光モジュールなしで 40km の SMF 相当になる", "PoE 端末では給電とデータが同じケーブルになり得る"], "answer": "A, B, D", "explain": "銅線だけで長距離 SMF 相当にはならない。"}, {"id": "Q8", "stem": "リンクダウン切り分けとして適切なものを選べ。", "type": "multi", "choices": ["対向機器の電源とケーブルを確認する", "別ポート・別ケーブルで切り替える", "いきなり本番コアルータの設定を全消去する", "`show interfaces status` で状態を見る"], "answer": "A, B, D", "explain": "設定の全消去は切り分け手順として不適切。"}, {"id": "Q9", "stem": "半二重接続で観察されやすいものとして適切なものを選べ。", "type": "multi", "choices": ["collisions", "late collisions（条件による）", "常に 100Gbps 固定", "全二重よりスループットが落ちやすい"], "answer": "A, B, D", "explain": "半二重で 100Gbps 固定になるわけではない。"}, {"id": "Q10", "stem": "送受信を同時に行う二重化モードを何と呼ぶか。", "type": "text", "choices": [], "answer": "全二重（full duplex）", "explain": "送受信同時。"}, {"id": "Q11", "stem": "光ファイバで送受信の向きを取り違えたとき、典型的にどうなるか。（一言）", "type": "text", "choices": [], "answer": "リンクしない／通信できない（など）", "explain": "Tx/Rx 取り違えは光で頻出。"}, {"id": "Q12", "stem": "新しいサーバを Gigabit スイッチに接続した。リンクは上がるが転送が極端に遅く、インタフェースに collision と CRC が増える。サーバ側 NIC は 100 Mbps / half 固定、スイッチ側は auto だった。最も適切な対処はどれか。", "type": "single", "choices": ["両端を auto（または同じ速度・全二重）に揃える", "すべての VLAN を削除する", "デフォルトルートだけ消す", "STP を無効化するだけで終わる"], "answer": "A", "explain": "速度・二重化を両端で一致させる。"}]</script>
