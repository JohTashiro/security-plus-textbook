      <script type="application/json" id="quiz-data">[{"id": "Q1", "stem": "攻撃に使われうる「弱点」そのものを指す用語はどれか。", "type": "single", "choices": ["Vulnerability（脆弱性）", "だけ EtherChannel", "Native VLAN の色", "OSPF エリア ID"], "answer": "A", "explain": "弱点は脆弱性。"}, {"id": "Q2", "stem": "機器の VTY 管理で、平文より推奨されやすいのはどれか。", "type": "single", "choices": ["SSH", "常に Telnet のみ", "だけ CDP 無効化で十分", "パスワード無しコンソールのみ"], "answer": "A", "explain": "管理は SSH 推奨。"}, {"id": "Q3", "stem": "「誰か」を確かめる AAA の要素はどれか。", "type": "single", "choices": ["Authentication", "だけ Queuing", "だけ Spanning Tree", "だけ CAPWAP チャネル"], "answer": "A", "explain": "認証は Authentication。"}, {"id": "Q4", "stem": "送信元・宛先・プロトコル・ポートまで見られることが多い ACL はどれか。", "type": "single", "choices": ["拡張 ACL", "標準 ACL のみ（常に）", "だけ PortFast", "だけ SSID 隠蔽"], "answer": "A", "explain": "拡張 ACL が詳細照合。"}, {"id": "Q5", "stem": "アクセスポートで許可 MAC を制限する機能はどれか。", "type": "single", "choices": ["Port security", "だけ NAT overload", "だけ NTP stratum", "だけ DNS MX"], "answer": "A", "explain": "MAC 制限は port security。"}, {"id": "Q6", "stem": "拠点間を常時つなぐ IPsec VPN の典型呼称はどれか。", "type": "single", "choices": ["Site-to-site", "だけ PortFast", "だけ LACP", "だけ PAT プール名"], "answer": "A", "explain": "拠点間は site-to-site。"}, {"id": "Q7", "stem": "セキュリティプログラムの要素として適切なものを選べ。", "type": "multi", "choices": ["ユーザ意識向上", "訓練", "物理アクセス制御", "ケーブルの色名の暗記のみ"], "answer": "A, B, C", "explain": "色名暗記はプログラムではない。"}, {"id": "Q8", "stem": "レイヤ2セキュリティとして適切なものを選べ。", "type": "multi", "choices": ["DHCP snooping", "Dynamic ARP inspection", "Port security", "ルーティングテーブルのメトリック色"], "answer": "A, B, C", "explain": "メトリック色は無関係。"}, {"id": "Q9", "stem": "ACL 運用として適切なものを選べ。", "type": "multi", "choices": ["上から順に最初の一致が効く", "暗黙の deny があることを意識する", "適用インタフェースと方向（in/out）を確認する", "ACL は常に STP Root だけが読む"], "answer": "A, B, C", "explain": "STP Root 専用ではない。"}, {"id": "Q10", "stem": "AAA のうち「何をしてよいか」を表す英単語を書け。", "type": "text", "choices": [], "answer": "Authorization", "explain": "認可。"}, {"id": "Q11", "stem": "正規でない DHCP サーバの応答を抑止する L2 機能名を書け。", "type": "text", "choices": [], "answer": "DHCP snooping", "explain": "不正 DHCP 抑止。"}, {"id": "Q12", "stem": "ゲスト VLAN から社内 SSH（tcp/22）だけを止め、Web 閲覧は許可したい。最も妥当な初動はどれか。", "type": "single", "choices": ["ゲスト側インタフェースに拡張 ACL で tcp/22 を deny し、他を permit する", "全拠点の OSPF を消す", "すべての SSID をオープンにする", "syslog を止めてディスクを初期化する"], "answer": "A", "explain": "特定ポート拒否は拡張 ACL。"}]</script>
